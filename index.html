<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="./images/icons/kitchen.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./images/icons/kitchen.png">
<title>Kitchen</title>
<link rel="stylesheet" href="./shared/base.css">
<link rel="stylesheet" href="./styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<script src="./shared/utils.js"></script>
</head>
<body>

<header class="app-head">
  <div class="container">
    <div class="app-head-row">
      <div class="app-title">The Kitchen</div>
      <button class="key-btn" onclick="promptForGitToken()" title="Set GitHub token" aria-label="Set GitHub token"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3"/><path d="M16 7l3 3"/></svg></button>
    </div>
  </div>
</header>

<div class="container" id="app">
  <div class="filters-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 12 12" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="#666" stroke-width="1.4"/><line x1="9" y1="9" x2="11.5" y2="11.5" stroke="#666" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search dishes or ingredients…">
    </div>
    <button class="clear-btn" id="clearBtn">Clear</button>
    <div class="filter-btn-wrap">
      <button class="filter-btn" id="filterBtn" aria-label="Open filters" onclick="openFilterSheet()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.3"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.3"/></svg>
      </button>
      <span class="filter-badge" id="filterBadge"></span>
    </div>
  </div>
  <div class="course-bar" id="courseBar"></div>
  <div class="results-info" id="resultsInfo"></div>
  <div class="recipe-grid" id="recipeGrid"></div>
</div>

<!-- Meal planner (day view is drawn here by js/meal-plan.js) -->
<div class="container" id="planApp" style="display:none"></div>

<!-- Filter sheet (slide-up, chips) -->
<div class="fs-overlay" id="filterOverlay">
  <div class="fs-sheet">
    <div class="sheet-handle"></div>
    <div class="fs-nav">
      <button class="fs-nav-btn" onclick="clearSheetFilters()">Clear all</button>
      <div class="fs-nav-title">Filters</div>
      <button class="fs-nav-btn bold" onclick="closeFilterSheet()">Done</button>
    </div>
    <div class="fs-body" id="filterBody"></div>
    <div class="fs-foot"><button class="fs-show" id="filterShowBtn" onclick="closeFilterSheet()"></button></div>
  </div>
</div>

<!-- View modal — wraps in .modal-scroll so hero+tabs stay sticky-like -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-scroll" id="modalScroll">
      <div class="back-bar" id="backBar" style="display:none"></div>
      <div class="modal-img-wrap" id="modalImgWrap"></div>
      <div class="modal-hero" id="modalHero"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<!-- Edit / Create iOS sheet -->
<div class="ios-overlay" id="editorOverlay">
  <div class="ios-sheet">
    <div class="sheet-handle"></div>
    <div class="ios-nav-bar">
      <button class="ios-link-btn" onclick="closeEditor()">Cancel</button>
      <div class="ios-nav-title" id="editorTitle">New Recipe</div>
      <button class="ios-link-btn bold" id="editorSaveBtn" onclick="saveRecipe()">Save</button>
    </div>
    <div class="ios-sheet-body" id="editorBody"></div>
  </div>
</div>

<!-- Recipe picker (link an ingredient to a sub-recipe) -->
<div class="pk-overlay" id="pickerOverlay">
  <div class="fs-sheet">
    <div class="sheet-handle"></div>
    <div class="fs-nav">
      <button class="fs-nav-btn" onclick="closePicker()">Cancel</button>
      <div class="fs-nav-title">Link to a recipe</div>
      <span style="min-width:64px"></span>
    </div>
    <div class="fs-body">
      <div style="padding-top:12px"><input class="pk-search" autocomplete="off" id="pickerSearch" type="text" placeholder="Search recipes…" oninput="renderPickerList()"></div>
      <div class="pk-list" id="pickerList"></div>
      <div id="pickerRemoveWrap"></div>
    </div>
  </div>
</div>

<!-- Meal planner: add a recipe or a food to a slot -->
<div class="pk-overlay" id="planAddOverlay">
  <div class="fs-sheet">
    <div class="sheet-handle"></div>
    <div class="fs-nav">
      <button class="fs-nav-btn" onclick="closePlanAdd()">Cancel</button>
      <div class="fs-nav-title" id="planAddTitle">Add</div>
      <span style="min-width:64px"></span>
    </div>
    <div class="pl-tabs">
      <button class="pl-tab on" id="planTabRecipe" onclick="planAddSwitch('recipe')">Recipe</button>
      <button class="pl-tab" id="planTabFood" onclick="planAddSwitch('food')">Food</button>
    </div>
    <div class="fs-body" id="planAddBody"></div>
    <div class="fs-foot" id="planAddFoot"></div>
  </div>
</div>

<!-- Meal planner: the ⋯ menu on an item -->
<div class="pl-act-overlay" id="planActOverlay">
  <div class="pl-act-sheet">
    <div class="pl-act-title" id="planActTitle"></div>
    <button class="pl-act-btn" id="planActMoveBtn" onclick="planActOpenDest('move')">Move…</button>
    <button class="pl-act-btn" id="planActCopyBtn" onclick="planActOpenDest('copy')">Copy…</button>
    <button class="pl-act-btn" id="planActLeftBtn" onclick="planActOpenDest('left')">Copy as leftovers…</button>
    <button class="pl-act-btn danger" id="planActRemoveBtn" onclick="planActRemove()">Remove from plan</button>
    <button class="pl-act-btn" onclick="closePlanAct()">Cancel</button>
  </div>
</div>

<!-- Meal planner: where to move or copy an item (day, slot, servings) -->
<div class="pl-act-overlay" id="planDestOverlay">
  <div class="pl-act-sheet">
    <div class="pl-act-title" id="planDestTitle"></div>
    <div id="planDestBody"></div>
    <button class="pl-act-btn pl-dest-ok" id="planDestOk" onclick="planDestConfirm()">OK</button>
    <button class="pl-act-btn" onclick="closePlanDest()">Cancel</button>
  </div>
</div>

<div class="save-toast" id="saveToast"></div>

<!-- Bottom navigation: Recipes, Plan, New (thin-line custom icons, drawn 2 Nov) -->
<nav class="bottom-nav" aria-label="Main">
  <div class="bn-inner">
    <button class="bn-btn active" id="bnRecipes" onclick="setAppView('recipes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18c0 4.4-3.9 7.8-9 7.8S3 16.4 3 12z"/><path d="M8 21.5h8"/><path d="M13.2 10.2 18.6 5"/><ellipse cx="19.9" cy="3.8" rx="1.1" ry="1.9" transform="rotate(45 19.9 3.8)"/></svg>
      <span>Recipes</span></button>
    <button class="bn-btn" id="bnPlan" onclick="setAppView('plan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M8 3v3.5M16 3v3.5"/><path d="M7.6 9.6v2.9M9.5 9.6v2.9M11.4 9.6v2.9M7.6 12.5c0 1 .8 1.5 1.9 1.5s1.9-.5 1.9-1.5M9.5 14V18"/><path d="M14.6 18V9.7c1.5.9 2.2 2.4 2.2 4.3h-2.2"/></svg>
      <span>Plan</span></button>
    <button class="bn-btn bn-new" id="bnNew" onclick="openEditor(null)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></svg>
      <span>New</span></button>
  </div>
</nav>


<script src="./js/constants.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/github.js"></script>
<script src="./js/data.js"></script>
<script src="./js/browse.js"></script>
<script src="./js/recipe-modal.js"></script>
<script src="./js/editor.js"></script>
<script src="./js/meal-plan.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
